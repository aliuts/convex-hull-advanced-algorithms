<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Convex Hull Comparison</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <h1>Convex hull comparison</h1>

  <div class="row">
    <label>Dataset
      <select id="kind">
        <option value="uniform">Uniform</option>
        <option value="clustered">Clustered</option>
        <option value="circular">Circular</option>
        <option value="collinear">Collinear</option>
      </select>
    </label>
    <label>Points <input id="count" type="number" min="0" max="10000" value="100"></label>
    <label>Seed <input id="seed" type="number" value="42"></label>
    <button id="generate">Generate</button>
    <button id="clear">Clear</button>
  </div>

  <canvas id="plane" aria-label="Points and convex hull"></canvas>
  <p class="hint"><span id="point-count">0 points</span> · click to add a point, right-click to remove one</p>

  <div class="row">
    <label>Algorithm <select id="algorithm"><option value="all">Compare all</option></select></label>
    <button id="run" class="primary">Run</button>
  </div>

  <p id="error" hidden></p>

  <table>
    <thead><tr><th>Algorithm</th><th>Time</th><th>Hull vertices</th></tr></thead>
    <tbody id="results"></tbody>
  </table>
</main>
<script src="/app.js"></script>
</body>
</html>
